<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Dashboard</title>
    <link
      rel="shortcut icon"
      href="assets/images/weather.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="header-title">
            <svg
              viewBox="0 0 24 24"
              width="30"
              height="30"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="8.5" cy="8.5" r="3" />
              <path d="M8.5 2v1.5M2 8.5h1.5M3.9 3.9l1 1M13.1 3.9l-1 1" />
              <path
                d="M8 20h9.5a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6 1A3 3 0 0 0 8 20z"
              />
            </svg>
          </span>
          <h1>Weather Dashboard</h1>
        </div>
        <p>Check the weather in any city around the world</p>
      </header>

      <section class="search">
        <label for="city-input" class="visually-hidden">City name</label>
        <div class="search-box">
          <input
            type="text"
            id="city-input"
            placeholder="Search for a city, e.g. Cairo"
            autocomplete="off"
          />
          <ul id="suggestions" class="suggestions hidden"></ul>
        </div>
        <button type="button" id="search-button">Search</button>
      </section>

      <p id="message" class="message" aria-live="polite">
        Welcome! Search for a city to see its weather.
      </p>

      <div id="weather-content" class="weather-content hidden">
        <section class="current" aria-label="Current weather">
          <div>
            <h2 id="current-city"></h2>
            <p id="current-date" class="current-date"></p>
            <p id="current-temp" class="current-temp"></p>
            <p id="current-condition" class="current-condition"></p>
            <p id="current-feels" class="current-feels"></p>
          </div>
          <div id="current-icon" class="current-icon" aria-hidden="true"></div>
        </section>

        <section class="details" aria-label="Weather details">
          <div class="card detail-card">
            <span class="detail-icon" aria-hidden="true">💧</span>
            <span class="detail-label">Humidity</span>
            <span id="detail-humidity" class="detail-value"></span>
          </div>
          <div class="card detail-card">
            <span class="detail-icon" aria-hidden="true">💨</span>
            <span class="detail-label">Wind Speed</span>
            <span id="detail-wind" class="detail-value"></span>
          </div>
          <div class="card detail-card">
            <span
              id="detail-icon"
              class="detail-icon"
              aria-hidden="true"
            ></span>
            <span class="detail-label">Condition</span>
            <span id="detail-condition" class="detail-value"></span>
          </div>
        </section>

        <section aria-label="5-day forecast">
          <h2 class="section-title">5-Day Forecast</h2>
          <div id="forecast-list" class="forecast"></div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Weather Dashboard. Data by Open-Meteo.</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
